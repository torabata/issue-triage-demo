# docker-compose.yml — run the dashboard and the test suite.
#
# Usage:
#   docker compose up dashboard            # run dashboard on http://localhost:8501
#   docker compose run --rm tests          # run the pytest suite
#   docker compose run --rm cli python ... # ad-hoc one-off scripts

services:
  dashboard:
    build: .
    image: devin-triage-agent
    env_file: .env
    ports:
      - "8501:8501"
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  tests:
    build: .
    image: devin-triage-agent
    env_file: .env
    profiles: ["tests"]
    command: pytest -v tests/

  cli:
    build: .
    image: devin-triage-agent
    env_file: .env
    profiles: ["cli"]
    entrypoint: ["python"]
